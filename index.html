<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="The Oracle of Tantra — a scholarly conversational guide to Tantra and related esoteric traditions.">
  <title>Oracle of Tantra — By Rudra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.3/dist/purify.min.js"></script>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#090d16;color:#eef2f7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .app-bg{background:radial-gradient(circle at 50% -10%,rgba(180,110,20,.13),transparent 36%),#090d16}.glass{background:rgba(17,24,39,.82);backdrop-filter:blur(16px)}
    .markdown-body{line-height:1.75}.markdown-body p{margin:.55rem 0}.markdown-body h1,.markdown-body h2,.markdown-body h3{color:#fbbf24;font-weight:700;margin:1rem 0 .45rem}.markdown-body ul,.markdown-body ol{padding-left:1.4rem;margin:.5rem 0}.markdown-body li{margin:.2rem 0}.markdown-body strong{color:#f8c65a}.markdown-body code{background:#0b1220;padding:.12rem .35rem;border-radius:.3rem}.markdown-body blockquote{border-left:2px solid #b7791f;padding-left:1rem;color:#aab4c2}
    .dot{width:7px;height:7px;border-radius:50%;background:#fbbf24;animation:blink 1s infinite alternate}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes blink{from{opacity:.25;transform:translateY(0)}to{opacity:1;transform:translateY(-3px)}}
    .mic-listening{color:#ef4444!important;box-shadow:0 0 0 6px rgba(239,68,68,.08)}
    .fade-in{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  </style>
</head>
<body class="app-bg h-full overflow-hidden">
<div class="h-full flex flex-col">
  <header class="glass border-b border-white/10 shrink-0">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-full bg-amber-600/20 border border-amber-500/30 grid place-items-center text-amber-400 shrink-0" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
        <div class="min-w-0"><h1 class="text-base sm:text-lg font-semibold tracking-wide truncate">The Oracle of Tantra</h1><p class="text-[11px] text-slate-500">A research-oriented project by Rudra</p></div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="clear-btn" class="hidden sm:inline-flex text-xs px-3 py-2 rounded-lg border border-white/10 text-slate-400 hover:text-white hover:bg-white/5 transition" type="button">New conversation</button>
        <div class="flex rounded-lg bg-black/30 border border-white/10 p-1 text-xs">
          <button id="lang-en" type="button" class="px-3 py-1.5 rounded-md bg-amber-600 text-white">English</button>
          <button id="lang-bn" type="button" class="px-3 py-1.5 rounded-md text-slate-400 hover:text-white">বাংলা</button>
        </div>
      </div>
    </div>
  </header>

  <main id="chat" class="flex-1 overflow-y-auto px-4 py-7 sm:px-6 scroll-smooth">
    <div id="messages" class="max-w-3xl mx-auto space-y-5">
      <section id="welcome" class="fade-in pt-8 sm:pt-16 text-center">
        <div class="mx-auto mb-5 w-16 h-16 rounded-full border border-amber-500/25 bg-amber-500/5 grid place-items-center text-amber-400">
          <span class="text-2xl">◈</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight">Enter the archive.</h2>
        <p id="welcome-copy" class="mt-3 text-sm sm:text-base text-slate-400 max-w-xl mx-auto">Ask about Tantra, Vajrayana, Śākta traditions, texts, concepts, history, or connections between esoteric traditions.</p>
        <div class="mt-7 grid sm:grid-cols-3 gap-2 text-left">
          <button class="suggestion rounded-xl border border-white/10 bg-white/[.025] p-3 hover:bg-white/[.05] transition" data-prompt="Explain the historical meaning of Kaula Tantra and distinguish it from modern popular interpretations."><span class="text-amber-400">Kaula</span><span class="block text-xs text-slate-500 mt-1">History & interpretation</span></button>
          <button class="suggestion rounded-xl border border-white/10 bg-white/[.025] p-3 hover:bg-white/[.05] transition" data-prompt="What is the relationship between Indian Tantra and Buddhist Vajrayana? Explain carefully without collapsing the traditions together."><span class="text-amber-400">Vajrayana</span><span class="block text-xs text-slate-500 mt-1">Compare traditions</span></button>
          <button class="suggestion rounded-xl border border-white/10 bg-white/[.025] p-3 hover:bg-white/[.05] transition" data-prompt="Recommend primary and scholarly secondary sources for beginning serious study of Śākta Tantra."><span class="text-amber-400">Sources</span><span class="block text-xs text-slate-500 mt-1">Build a reading path</span></button>
        </div>
      </section>
    </div>
  </main>

  <footer class="shrink-0 border-t border-white/10 glass px-4 pt-3 pb-3 sm:px-6">
    <div class="max-w-3xl mx-auto">
      <div class="flex items-end gap-2 rounded-2xl border border-white/10 bg-black/30 p-2 focus-within:border-amber-500/50 transition">
        <textarea id="input" rows="1" maxlength="12000" class="flex-1 bg-transparent outline-none resize-none px-3 py-2 text-sm sm:text-base placeholder:text-slate-600 max-h-40" placeholder="Ask a question about Tantra…" aria-label="Your question"></textarea>
        <button id="mic" type="button" class="w-10 h-10 rounded-xl grid place-items-center text-slate-500 hover:text-white hover:bg-white/5 transition" title="Voice typing" aria-label="Voice typing">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
        </button>
        <button id="send" type="button" class="w-10 h-10 rounded-xl bg-amber-600 hover:bg-amber-500 text-white grid place-items-center transition disabled:opacity-40" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
      <div class="flex items-center justify-between mt-2 px-1 text-[10px] text-slate-600"><span id="status">Ready</span><span>Responses are AI-generated; verify important historical claims.</span></div>
    </div>
  </footer>
</div>
<script>
const API='/api/chat';
const state={language:localStorage.getItem('oracle-language')||'en',messages:JSON.parse(localStorage.getItem('oracle-history')||'[]'),waiting:false,listening:false,recognition:null};
const $=id=>document.getElementById(id); const input=$('input'), messages=$('messages'), welcome=$('welcome'), status=$('status');
function save(){localStorage.setItem('oracle-language',state.language);localStorage.setItem('oracle-history',JSON.stringify(state.messages.slice(-20)));}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function renderMarkdown(text){try{const html=marked.parse(text,{breaks:true});return DOMPurify.sanitize(html,{USE_PROFILES:{html:true}})}catch{return escapeHtml(text).replace(/\n/g,'<br>')}}
function bubble(role,text){welcome.classList.add('hidden');const row=document.createElement('div');row.className=`fade-in flex ${role==='user'?'justify-end':'justify-start'}`;const box=document.createElement('div');box.className=role==='user'?'max-w-[88%] rounded-2xl rounded-tr-sm bg-amber-600/15 border border-amber-500/20 px-4 py-3 text-sm text-amber-50':'w-full rounded-2xl rounded-tl-sm bg-slate-900/70 border border-white/10 px-4 py-4 text-sm text-slate-200 markdown-body';box[role==='user'?'textContent':'innerHTML']=role==='user'?text:renderMarkdown(text);row.appendChild(box);messages.appendChild(row);$('chat').scrollTop=$('chat').scrollHeight;return row}
function restore(){for(const m of state.messages) bubble(m.role,m.content);if(state.messages.length) welcome.classList.add('hidden')}
function setLanguage(lang){state.language=lang;save();$('lang-en').className=lang==='en'?'px-3 py-1.5 rounded-md bg-amber-600 text-white':'px-3 py-1.5 rounded-md text-slate-400 hover:text-white';$('lang-bn').className=lang==='bn'?'px-3 py-1.5 rounded-md bg-amber-600 text-white':'px-3 py-1.5 rounded-md text-slate-400 hover:text-white';input.placeholder=lang==='bn'?'তন্ত্র সম্পর্কে একটি প্রশ্ন করুন…':'Ask a question about Tantra…';$('welcome-copy').textContent=lang==='bn'?'তন্ত্র, বজ্রযান, শাক্ত ঐতিহ্য, গ্রন্থ, ধারণা, ইতিহাস বা বিভিন্ন গুপ্ত ঐতিহ্যের সম্পর্ক সম্পর্কে জিজ্ঞাসা করুন।':'Ask about Tantra, Vajrayana, Śākta traditions, texts, concepts, history, or connections between esoteric traditions.';if(state.recognition)state.recognition.lang=lang==='bn'?'bn-IN':'en-US'}
function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'}
function loading(){const row=document.createElement('div');row.id='loading';row.className='fade-in flex';row.innerHTML='<div class="rounded-2xl rounded-tl-sm bg-slate-900/70 border border-white/10 px-5 py-4 flex gap-1"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>';messages.appendChild(row);$('chat').scrollTop=$('chat').scrollHeight;return row}
async function send(){const text=input.value.trim();if(!text||state.waiting)return;state.waiting=true;$('send').disabled=true;input.disabled=true;status.textContent=state.language==='bn'?'ভাবনা চলছে…':'Consulting the archive…';bubble('user',text);input.value='';grow();const load=loading();try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:state.language,messages:[...state.messages,{role:'user',content:text}].slice(-20)})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||`Request failed (${res.status})`);load.remove();bubble('assistant',data.reply||'No response was returned.');state.messages.push({role:'user',content:text},{role:'assistant',content:data.reply||''});state.messages=state.messages.slice(-20);save();status.textContent=state.language==='bn'?'প্রস্তুত':'Ready'}catch(err){load.remove();bubble('assistant',`**Connection error**\n\n${err.message}\n\nPlease try again.`);status.textContent='Connection error'}finally{state.waiting=false;$('send').disabled=false;input.disabled=false;input.focus()}}
function clearChat(){state.messages=[];save();messages.innerHTML='';messages.appendChild(welcome);welcome.classList.remove('hidden');status.textContent='New conversation'}
$('send').onclick=send;$('clear-btn').onclick=clearChat;input.oninput=grow;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('lang-en').onclick=()=>setLanguage('en');$('lang-bn').onclick=()=>setLanguage('bn');document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;grow();input.focus()});
try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){state.recognition=new SR();state.recognition.continuous=false;state.recognition.interimResults=false;state.recognition.lang=state.language==='bn'?'bn-IN':'en-US';state.recognition.onstart=()=>{$('mic').classList.add('mic-listening');state.listening=true;status.textContent='Listening…'};state.recognition.onend=()=>{$('mic').classList.remove('mic-listening');state.listening=false;status.textContent='Ready'};state.recognition.onresult=e=>{const t=e.results[0][0].transcript;input.value+=(input.value?' ':'')+t;grow()};state.recognition.onerror=()=>status.textContent='Voice input unavailable';$('mic').onclick=()=>state.listening?state.recognition.stop():state.recognition.start()}else $('mic').style.display='none'}catch{$('mic').style.display='none'}
setLanguage(state.language);restore();
</script>
</body>
</html>
