name: Sync Oracle visual assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/generated
          curl -L --fail --retry 3 'https://cdn.creativeclaw.co/u/486ee905/images/230ea5ac-c6e1-4f97-8723-aba2284debb9.png' -o assets/generated/oracle-tantra-master-desktop.png
          curl -L --fail --retry 3 'https://cdn.creativeclaw.co/u/486ee905/images/4dd00f8e-2b3a-4763-960b-9e0bdcf6829d.png' -o assets/generated/oracle-tantra-master-mobile.png
          curl -L --fail --retry 3 'https://cdn.creativeclaw.co/u/486ee905/images/5fb0c5ee-0cc5-4b28-9544-dd6491aaac49.png' -o assets/generated/oracle-tantra-oracle.png
          curl -L --fail --retry 3 'https://cdn.creativeclaw.co/u/486ee905/images/b4f990dc-08ad-42b1-a2b2-e4720ff21462.png' -o assets/generated/oracle-tantra-bookshelf.png
          curl -L --fail --retry 3 'https://cdn.creativeclaw.co/u/486ee905/images/73bf3975-c1ec-4596-968c-afbb138f2fbe.png' -o assets/generated/oracle-tantra-central-arch.png
          curl -L --fail --retry 3 'https://cdn.creativeclaw.co/u/486ee905/images/75381525-d868-456f-ae32-5ee1df2fdee0.png' -o assets/generated/oracle-tantra-objects.png

      - name: Commit assets back to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore: sync Oracle visual assets'
          git push
