name: Oracle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check backend
        working-directory: backend
        run: npm run check
      - name: Syntax check browser modules
        run: |
          node --check assets/oracle-assets.js
          node --check assets/oracle-auth.js
          node --check assets/oracle-data.js
          node --check assets/oracle-sources.js
          node --check assets/oracle-projects.js
          node --check assets/oracle-bookmarks.js
          node --check assets/oracle-ai-ux.js
      - name: Validate frontend structure
        run: |
          test -s index.html
          test -s assets/oracle-assets.js
          test -s assets/oracle-auth.js
          test -s assets/oracle-data.js
          test -s assets/oracle-sources.js
          test -s assets/oracle-projects.js
          test -s assets/oracle-bookmarks.js
          test -s assets/oracle-ai-ux.js
          grep -q 'id="chat"' index.html
          grep -q '/api/chat' index.html
          grep -q 'window.ORACLE_ASSETS' assets/oracle-assets.js
          grep -q 'oracle-data.js' assets/oracle-assets.js
          grep -q 'oracle-sources.js' assets/oracle-assets.js
          grep -q 'oracle-projects.js' assets/oracle-assets.js
          grep -q 'oracle-bookmarks.js' assets/oracle-assets.js
          grep -q 'oracle-ai-ux.js' assets/oracle-assets.js
          grep -q 'createClient' assets/oracle-auth.js
          grep -q 'source_submissions' assets/oracle-sources.js
          grep -q 'research_projects' assets/oracle-projects.js
          grep -q 'bookmarks' assets/oracle-bookmarks.js
