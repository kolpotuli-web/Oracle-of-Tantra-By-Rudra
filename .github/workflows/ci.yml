name: Oracle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Syntax check backend
        working-directory: backend
        run: npm run check

      - name: Backend smoke test
        working-directory: backend
        run: npm run smoke

      - name: Syntax check browser modules
        run: |
          node --check assets/oracle-assets.js
          node --check assets/oracle-auth.js
          node --check assets/oracle-data.js
          node --check assets/oracle-sources.js
          node --check assets/oracle-projects.js
          node --check assets/oracle-bookmarks.js
          node --check assets/oracle-conversations.js
          node --check assets/oracle-admin.js
          node --check assets/oracle-library.js
          node --check assets/oracle-i18n.js
          node --check assets/oracle-corpus.js
          node --check assets/oracle-citations.js
          node --check assets/oracle-ai-ux.js
          node --check assets/oracle-text-records.js
          node --check assets/oracle-workspace.js
          node --check assets/oracle-accessibility.js
          node --check assets/oracle-navigation.js

      - name: Validate frontend structure
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            index.html
            assets/oracle-assets.js
            assets/oracle-auth.js
            assets/oracle-data.js
            assets/oracle-sources.js
            assets/oracle-projects.js
            assets/oracle-bookmarks.js
            assets/oracle-conversations.js
            assets/oracle-admin.js
            assets/oracle-library.js
            assets/oracle-i18n.js
            assets/oracle-corpus.js
            assets/oracle-citations.js
            assets/oracle-ai-ux.js
            assets/oracle-text-records.js
            assets/oracle-workspace.js
            assets/oracle-accessibility.js
            assets/oracle-navigation.js
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

          grep -q 'id="chat"' index.html
          grep -q '/api/chat' index.html

          required_modules=(
            oracle-data.js
            oracle-sources.js
            oracle-projects.js
            oracle-bookmarks.js
            oracle-conversations.js
            oracle-admin.js
            oracle-library.js
            oracle-i18n.js
            oracle-corpus.js
            oracle-citations.js
            oracle-ai-ux.js
            oracle-text-records.js
            oracle-workspace.js
            oracle-accessibility.js
            oracle-navigation.js
          )

          for module in "${required_modules[@]}"; do
            grep -q "$module" assets/oracle-assets.js
          done

          grep -q 'window.ORACLE_ASSETS' assets/oracle-assets.js
          grep -q 'createClient' assets/oracle-auth.js
          grep -q 'source_submissions' assets/oracle-sources.js
          grep -q 'research_projects' assets/oracle-projects.js
          grep -q 'bookmarks' assets/oracle-bookmarks.js
          grep -q 'conversations' assets/oracle-conversations.js
          grep -q 'is_admin' assets/oracle-admin.js
          grep -q 'library_items' assets/oracle-admin.js
          grep -q 'oracle-library' assets/oracle-admin.js
          grep -q 'CORPUS_ENDPOINT' assets/oracle-assets.js
          grep -q 'get_citation_record' assets/oracle-citations.js
          grep -q '\[\[cite:' assets/oracle-citations.js
          grep -q 'oracleTextPages' assets/oracle-text-records.js
          grep -q 'research_projects' assets/oracle-workspace.js
          grep -q 'bookmarks' assets/oracle-workspace.js
          grep -q 'conversations' assets/oracle-workspace.js
          grep -q 'review_note' assets/oracle-admin.js
          grep -qi 'approve for corpus' assets/oracle-admin.js
          grep -q 'Skip to research content' assets/oracle-accessibility.js
          grep -q 'aria-modal' assets/oracle-accessibility.js
          grep -q 'Escape' assets/oracle-accessibility.js
          grep -q 'pageBack' assets/oracle-navigation.js
          grep -Eq 'e\.target[[:space:]]*===[[:space:]]*el' assets/oracle-navigation.js
          grep -q 'librarySearch' assets/oracle-library.js
          grep -q 'libraryFormatFilters' assets/oracle-library.js
