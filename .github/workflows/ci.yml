name: Oracle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Syntax check backend
        working-directory: backend
        run: npm run check

      - name: Backend smoke test
        working-directory: backend
        run: npm run smoke

      - name: Syntax check browser modules
        run: |
          for file in assets/*.js; do
            node --check "$file"
          done

      - name: Validate frontend structure
        run: node scripts/validate-frontend.mjs
