name: Oracle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Syntax check backend
        working-directory: backend
        run: npm run check
      - name: Backend smoke test
        working-directory: backend
        run: npm run smoke
      - name: Syntax check browser modules
        run: |
          node --check assets/oracle-assets.js
          node --check assets/oracle-auth.js
          node --check assets/oracle-data.js
          node --check assets/oracle-sources.js
          node --check assets/oracle-projects.js
          node --check assets/oracle-bookmarks.js
          node --check assets/oracle-conversations.js
          node --check assets/oracle-admin.js
          node --check assets/oracle-library.js
          node --check assets/oracle-i18n.js
          node --check assets/oracle-corpus.js
          node --check assets/oracle-citations.js
          node --check assets/oracle-ai-ux.js
          node --check assets/oracle-text-pages.js
          node --check assets/oracle-workspace.js
          node --check assets/oracle-accessibility.js
      - name: Validate frontend structure
        run: |
          test -s index.html
          test -s assets/oracle-assets.js
          test -s assets/oracle-auth.js
          test -s assets/oracle-data.js
          test -s assets/oracle-sources.js
          test -s assets/oracle-projects.js
          test -s assets/oracle-bookmarks.js
          test -s assets/oracle-conversations.js
          test -s assets/oracle-admin.js
          test -s assets/oracle-library.js
          test -s assets/oracle-i18n.js
          test -s assets/oracle-corpus.js
          test -s assets/oracle-citations.js
          test -s assets/oracle-ai-ux.js
          test -s assets/oracle-text-pages.js
          test -s assets/oracle-workspace.js
          test -s assets/oracle-accessibility.js
          grep -q 'id="chat"' index.html
          grep -q '/api/chat' index.html
          grep -q 'window.ORACLE_ASSETS' assets/oracle-assets.js
          grep -q 'oracle-data.js' assets/oracle-assets.js
          grep -q 'oracle-sources.js' assets/oracle-assets.js
          grep -q 'oracle-projects.js' assets/oracle-assets.js
          grep -q 'oracle-bookmarks.js' assets/oracle-assets.js
          grep -q 'oracle-conversations.js' assets/oracle-assets.js
          grep -q 'oracle-admin.js' assets/oracle-assets.js
          grep -q 'oracle-library.js' assets/oracle-assets.js
          grep -q 'oracle-i18n.js' assets/oracle-assets.js
          grep -q 'oracle-corpus.js' assets/oracle-assets.js
          grep -q 'oracle-citations.js' assets/oracle-assets.js
          grep -q 'oracle-ai-ux.js' assets/oracle-assets.js
          grep -q 'oracle-text-pages.js' assets/oracle-assets.js
          grep -q 'oracle-workspace.js' assets/oracle-assets.js
          grep -q 'oracle-accessibility.js' assets/oracle-assets.js
          grep -q 'createClient' assets/oracle-auth.js
          grep -q 'source_submissions' assets/oracle-sources.js
          grep -q 'research_projects' assets/oracle-projects.js
          grep -q 'bookmarks' assets/oracle-bookmarks.js
          grep -q 'conversations' assets/oracle-conversations.js
          grep -q 'is_admin' assets/oracle-admin.js
          grep -q 'CORPUS_ENDPOINT' assets/oracle-assets.js
          grep -q 'get_citation_record' assets/oracle-citations.js
          grep -q '\[\[cite:' assets/oracle-citations.js
          grep -q 'oracleTextPages' assets/oracle-text-pages.js
          grep -q 'research_projects' assets/oracle-workspace.js
          grep -q 'bookmarks' assets/oracle-workspace.js
          grep -q 'conversations' assets/oracle-workspace.js
          grep -q 'review_note' assets/oracle-admin.js
          grep -q 'approved for corpus' assets/oracle-admin.js
          grep -q 'Skip to research content' assets/oracle-accessibility.js
          grep -q 'aria-modal' assets/oracle-accessibility.js
          grep -q 'Escape' assets/oracle-accessibility.js
